<!DOCTYPE html>
<html>
<head>
    <!-- 基础URL设置 -->
    <base href="/">
    <!-- 字符编码设置 -->
    <meta charset="utf-8">
    <!-- 响应式视口设置 -->
    <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=1.0, user-scalable=no">
    <!-- 页面标题 -->
    <title>账号续费 - SillyTavern</title>
    <!-- 引入CSS样式文件 -->
    <link rel="stylesheet" type="text/css" href="css/login.css">
    <link href="webfonts/NotoSans/stylesheet.css" rel="stylesheet">
    <link href="css/fontawesome.min.css" rel="stylesheet">
    <link href="css/solid.min.css" rel="stylesheet">
    <!-- 引入jQuery库 -->
    <script src="lib/jquery-3.5.1.min.js"></script>
    <script src="scripts/renew.js"></script>
    <script>
        // 页面加载完成后执行
        window.onload = function() {
            // 获取CSRF令牌
            fetch('/api/csrf-token')
                .then(response => response.json())
                .then(data => {
                    console.log('初始化CSRF令牌获取成功');
                    $('#csrfToken').val(data.token);
                })
                .catch(error => {
                    console.error('初始化CSRF令牌获取失败:', error);
                });

            // 动态检测主站链接可用性
            $.ajax({
                url: 'https://ai.sllt.uk', // 替换为主站实际URL
                type: 'HEAD', // 使用HEAD请求，仅检查响应状态
                timeout: 5000, // 设置超时时间为5秒
                success: function() {
                    $('#linkPrompt').hide(); // 主站可用，隐藏提示
                },
                error: function() {
                    $('#linkPrompt').show(); // 主站不可用，显示提示
                }
            });
        };
    </script>
    <style>
        /* 续费页面主体样式 */
        body.renew {
            background: url('img/531049.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans', sans-serif;
            overflow: hidden;  /* 防止主体出现滚动条 */
        }

        /* 自定义滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* 弹出框阴影容器样式 */
        #shadow_popup {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 对话框弹出框样式 */
        #dialogue_popup {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px) brightness(0.8);
            border-radius: 15px;
            box-shadow: 0 2px 30px 0 rgba(0, 0, 0, 0.4);
            border: 0px solid rgba(255, 255, 255, 0.18);
            overflow: auto;
            max-height: 90vh;
        }

        /* 续费表单样式 */
        #renewForm {
            margin: 0 auto;
            padding-top: 0px;
            padding-right: 15px;
            padding-bottom: 18px;
            padding-left: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 0px;
        }

        /* 表单组样式 */
        .form-group {
            margin-bottom: 15px;
            position: relative;
            width: 100%;
            text-align: center;
        }

        /* 按钮区域样式 */
        .flex-container.flexGap10 {
            justify-content: center;
            width: 100%;
            display: flex;
            gap: 18px;
        }

        /* 菜单按钮基础样式 */
        .menu_button {
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 0 0 auto;
        }

        /* 输入框样式 */
        .text_pole {
            width: 90%;
            padding: 15px 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 18px;
            transition: all 0.3s ease;
            margin: 0 auto;
            display: block;
        }

        /* 输入框placeholder文字样式 */
        .text_pole::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* 输入框聚焦状态样式 */
        .text_pole:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 2px rgba(100, 149, 237, 0.5);
        }

        /* 错误信息样式 */
        .error-message {
            color: #ff6b6b;
            margin-top: 5px;
            font-size: 14px;
        }

        /* 卡密格式化样式 */
        .key-format {
            letter-spacing: 2px;
        }

        /* 续费提交按钮样式 */
        #submitRenew {
            background: #3a81d2;
            color: white;
            font-size: 18px;
            box-shadow: none;
            border: none;
        }

        /* 续费提交按钮悬停状态 */
        #submitRenew:hover {
            background: #5394de;
            transform: none;
            box-shadow: none;
        }

        /* 链接按钮样式 */
        a.menu_button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
        }

        /* 链接按钮悬停状态 */
        a.menu_button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 标题样式 */
        h2 {
            color: white;
            font-size: 28px;
            margin-top: 25px;
            margin-bottom: 20px;
            padding: 10px 0;
            text-align: center;
            width: 100%;
        }

        /* 续费消息提示框样式 */
        #renewMessage {
            margin-top: 10px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            font-family: 'Noto Sans', sans-serif;
        }

        .success {
            background-color: rgba(39, 174, 96, 0.3);
        }

        .error {
            background-color: rgba(231, 76, 60, 0.3);
        }

        .expiry-info {
            margin-top: 10px;
            color: #fff;
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>
<body class="renew">
<!-- 阴影弹出框容器 -->
<div id="shadow_popup">
    <!-- 对话框弹出框 -->
    <div id="dialogue_popup">
        <div id="dialogue_popup_holder">
            <div id="dialogue_popup_text">
                <div class="flex-container flexFlowColumn alignItemsCenter">
                    <!-- 标题区域 -->
                    <h2 class="flex-container flexFlowColumn alignItemsCenter">
                        <span>账户续费</span>
                    </h2>

                    <!-- 续费表单 -->
                    <form id="renewForm" class="wide100p">
                        <!-- CSRF令牌隐藏字段 -->
                        <input type="hidden" id="csrfToken" name="csrfToken" value="">

                        <!-- 用户名输入组 -->
                        <div class="form-group">
                            <input id="renewHandle" class="text_pole" type="text" placeholder="用户名" required>
                            <div id="handleError" class="error-message"></div>
                        </div>

                        <!-- 卡密输入组 -->
                        <div class="form-group">
                            <input id="cardKey" class="text_pole key-format" type="text" placeholder="卡密" required>
                            <div id="keyError" class="error-message"></div>
                        </div>

                        <!-- 按钮区域 -->
                        <div class="flex-container flexGap10">
                            <button id="submitRenew" class="menu_button" type="submit">续费</button>
                            <a href="login.html" class="menu_button">返回登录</a>
                        </div>
                    </form>

                    <!-- 卡密购买链接 -->
                    <div class="flex-container flexGap10">
                        <a href="https://ai.sllt.uk" target="_blank" class="menu_button">购买卡密(主站)</a>
                        <a href="https://ai.slltwl.ggff.net" target="_blank" class="menu_button">购买卡密 (备用)</a>
                    </div>

                    <!-- 用户提示 -->
                    <div class="expiry-info" style="margin-top: 10px;">
                        如果主站无法访问，请尝试备用链接购买卡密。
                    </div>

                    <!-- 续费消息提示 -->
                    <div id="renewMessage" style="display: none;"></div>

                    <!-- 过期时间信息 -->
                    <div id="expiryInfo" class="expiry-info" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
